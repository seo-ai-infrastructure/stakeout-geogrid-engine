name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders; CI does not connect to production services.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/stakeout_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/stakeout_ci
      PLATFORM_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - name: Device and measurement regressions
        working-directory: apps/worker
        run: |
          node --import tsx ../../tests/device-output.ts
          node --import tsx ../../tests/saved-proxy.ts
          node --import tsx ../../tests/maps-parser.ts
          node --import tsx --test ../../tests/demographics.test.ts ../../tests/demographic-map-view.test.ts
      - run: pnpm --filter web build
